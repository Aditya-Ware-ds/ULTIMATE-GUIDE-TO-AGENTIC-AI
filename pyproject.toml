[project]
name = "agentic-ai-mastery"
version = "0.1.0"
description = "A complete, open-source curriculum for AI agents and agentic systems, from zero to expert."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "anthropic>=0.69.0",
    "openai>=1.109.0",
    "google-genai>=1.32.0",
    "ollama>=0.6.0",
    "httpx>=0.28.0",
    "pydantic>=2.9.0",
    "tiktoken>=0.8.0",
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "jsonschema>=4.23.0",
    "mcp>=2.0.0",
    "pyyaml>=6.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-mermaid2-plugin>=1.1.0",
    "mkdocs-include-markdown-plugin>=6.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: tests that call real provider APIs and require API keys (excluded by default)",
]
addopts = "-m 'not live'"
testpaths = ["shared", "curriculum", "projects", "capstones"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shared"]
